name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Optional release version override. Defaults to the next stable version."
                required: false
                type: string

permissions: {}

concurrency:
    group: release-main
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            contents: write
            id-token: write
        env:
            GH_TOKEN: ${{ github.token }}

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.10"

            - name: Require main branch
              run: |
                  if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                      echo "Release workflow must be dispatched from main." >&2
                      exit 1
                  fi

            - name: Resolve release version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  git fetch --force --tags origin

                  VERSION="${INPUT_VERSION:-$(python3 -m stormlog.release_version)}"
                  TAG="v${VERSION}"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "Resolved release tag: ${TAG}"
                  echo "Resolved package version: ${VERSION}"

                  if gh release view "${TAG}" >/dev/null 2>&1; then
                      echo "Release ${TAG} already exists. Refusing to mutate an existing release." >&2
                      exit 1
                  fi

                  if git rev-parse "${TAG}" >/dev/null 2>&1; then
                      TAG_SHA="$(git rev-list -n 1 "${TAG}")"
                      HEAD_SHA="$(git rev-parse HEAD)"
                      if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
                          echo "Tag ${TAG} already points to ${TAG_SHA}, not ${HEAD_SHA}." >&2
                          exit 1
                      fi
                  fi

            - name: Install build dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip install build twine

            - name: Build package
              env:
                  SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  rm -rf build dist
                  python3 -m build

            - name: Check package
              run: |
                  twine check dist/*

            - name: Verify artifact versions
              env:
                  EXPECTED_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  python3 - <<'PY'
                  import os
                  from pathlib import Path

                  expected = os.environ["EXPECTED_VERSION"]
                  dist_files = sorted(Path("dist").glob("*"))
                  if not dist_files:
                      raise SystemExit("No build artifacts were produced.")

                  for path in dist_files:
                      if expected not in path.name:
                          raise SystemExit(
                              f"Artifact {path.name} does not contain expected version {expected}."
                          )
                  PY

            - name: Enforce release artifact version policy
              run: |
                  if ls dist/* | grep -Eq '(\.dev|[+])'; then
                      echo "Refusing upload: dist contains dev/local versions." >&2
                      ls -1 dist
                      exit 1
                  fi

            - name: Publish to PyPI with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0

            - name: Create GitHub release
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  RELEASE_TARGET: ${{ github.sha }}
              run: |
                  gh release create "${RELEASE_TAG}" dist/* \
                      --target "${RELEASE_TARGET}" \
                      --title "${RELEASE_TAG}" \
                      --generate-notes
